appId: me.nemtudo.golive
productName: Go Live
copyright: © NemTudo

directories:
  output: electron/release
  buildResources: electron/build

# No spaces in installer filenames. electron-builder's default puts them in
# ("GoLive Setup 0.1.0.exe") while writing the *hyphenated* name into
# latest.yml, and GitHub rewrites spaces again on upload — three spellings of
# one file, across the two manifests the updater and /download depend on.
# Naming them explicitly makes all of it the same string.
artifactName: ${productName}-${version}.${ext}

# Where `electron-builder --publish always` uploads the installers, and what
# the site's /download route reads to find the newest ones. GitHub Releases
# is also what an auto-updater would consume later, so pointing at it now
# costs nothing and keeps that door open.
#
# Publishing needs GH_TOKEN in the environment; without it electron-builder
# builds normally and simply skips the upload.
publish:
  provider: github
  owner: Nem-Tudo
  repo: group-sharescreen
  # electron-builder's own default, stated explicitly because it is load
  # bearing and invisible otherwise: uploads land in a *draft* release, and a
  # draft is not returned by GitHub's `releases/latest` API. So neither the
  # updater nor the site's /download route sees a build until someone presses
  # "Publish release" on GitHub. That press is the deliberate go-live moment —
  # the three platforms finish at different times, and shipping half a release
  # to everyone while the Mac build is still running would be worse than
  # waiting.
  releaseType: draft

# Only the shell ships. The UI is the deployed site (see electron/main.ts's
# opening comment), so none of .next/, app/, lib/ or the Next dependency tree
# belongs in the package.
#
# The node_modules exclusion is doing real work and must not be "tidied
# away": electron-builder bundles every production dependency by default,
# regardless of what this list says, because `files` filters project files
# and not the module tree. Without that line the installer ships all of
# Next, React, sharp and their native binaries — measured at 278 MB, versus
# well under one for the shell itself — none of which is ever loaded, since
# esbuild bundles the three entrypoints and `electron` comes from the
# runtime (see electron/build.mjs).
files:
  - electron/dist/**/*
  - electron/picker.html
  - package.json
  - "!node_modules/**/*"
  # Linux sets the window icon from a file at runtime rather than from the
  # executable, so it has to be inside the package — see WINDOW_ICON in
  # electron/main.ts. Windows and macOS read it from the binary instead and
  # would not need this, but shipping 13 KB everywhere beats a platform
  # conditional in the file list.
  - electron/build/icon.png

# The desktop build's whole purpose is a real screen picker and a working
# OAuth handoff, so the protocol registration below is load-bearing rather
# than a nicety: without it the login started in the browser has nowhere to
# come back to.
protocols:
  - name: GoLive
    schemes:
      - golive

win:
  target:
    - target: nsis
      arch: [x64]
  # The WASAPI capture helper that lets a screen share carry system audio
  # *without* the room's own voices in it — see electron/systemAudio.ts.
  #
  # extraResources rather than files, and that is not a style choice: `files`
  # puts everything inside app.asar, and an executable cannot be launched
  # from inside an asar archive — the OS sees one file, not a directory it
  # can spawn from. This copies it into resources/ as a real file, which is
  # where systemAudio.ts's helperPath() looks when app.isPackaged.
  #
  # A directory plus a filter rather than naming the file directly: a machine
  # without the C++ toolchain skips the compile (see electron/native/build.mjs)
  # and produces no binary, and electron-builder complains about a source path
  # that does not exist while copying an empty directory happily. That build
  # then falls back to Electron's own loopback capture. The directory itself
  # is committed with a .gitkeep for exactly this reason.
  extraResources:
    - from: electron/native/bin
      to: .
      filter:
        - golive-audiocap.exe
  # Unsigned builds trip SmartScreen. Set CSC_LINK/CSC_KEY_PASSWORD in CI to
  # sign; electron-builder picks them up without further config here.
  signtoolOptions:
    signingHashAlgorithms: [sha256]

nsis:
  # "Setup" in the name so it reads as an installer rather than the app
  # itself once it is sitting in someone's Downloads folder.
  artifactName: ${productName}-Setup-${version}.${ext}
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true

mac:
  category: public.app-category.video
  target:
    # One universal binary rather than separate arm64/x64 builds, because
    # /download has to pick without asking and *cannot tell them apart*:
    # browsers on Apple Silicon still report "Intel Mac OS X" in the user
    # agent for compatibility, so there is no honest way to detect the
    # architecture server-side. Shipping one file that runs on both trades
    # download size for never handing someone an app that won't open.
    - target: dmg
      arch: [universal]
    # Not redundant with the dmg above, and not optional: Squirrel.Mac
    # updates from a zip, and electron-updater's MacUpdater looks for one
    # while explicitly skipping dmg and pkg. Ship only the dmg and macOS
    # auto-update finds no file to apply — silently. The dmg is what a
    # person downloads; this is what the updater consumes.
    - target: zip
      arch: [universal]
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: electron/build/entitlements.mac.plist
  entitlementsInherit: electron/build/entitlements.mac.plist
  # macOS refuses camera/mic/screen access outright unless the binary
  # declares why it wants them — and does so silently, which reads as "the
  # app is broken" rather than "a permission is missing".
  extendInfo:
    NSCameraUsageDescription: O GoLive usa a câmera para você transmitir vídeo na sala.
    NSMicrophoneUsageDescription: O GoLive usa o microfone para você falar na sala.
    NSScreenCaptureUsageDescription: O GoLive captura sua tela para compartilhá-la com a sala.

linux:
  category: Network
  target:
    # AppImage only, on purpose. A .deb would be nice for Debian/Ubuntu, but
    # electron-builder refuses to build one without a maintainer address —
    # it reads `author.email` from package.json, and there is no sensible
    # value to invent for that. To add it back: give `author` the object
    # form ({ name, email }) or set `linux.maintainer` here, then add
    # `- target: deb` below.
    #
    # AppImage is the better default regardless: one file, no package
    # manager, runs on any distribution.
    - target: AppImage
      arch: [x64]
