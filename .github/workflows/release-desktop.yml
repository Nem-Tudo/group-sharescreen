# Builds and publishes the desktop app for all three platforms.
#
# This exists for a reason that has nothing to do with convenience: a macOS
# build can only be produced on macOS. Building the .dmg from a Windows
# machine is not slow or awkward, it is impossible — so without CI the Mac
# version could never ship at all. Linux is the same story to a lesser
# degree, and Windows is here so all three come from one place and one
# version number.
#
# Triggered by a version tag, which is what makes releasing a deliberate act
# rather than something an ordinary commit can do by accident.

name: Release desktop app

on:
  push:
    tags:
      - "v*"
  # Lets a release be re-run from the Actions tab without inventing a tag,
  # for the case where one platform's build failed and the others are fine.
  workflow_dispatch:

# Creating a release is a *write* to the repository, and the default
# GITHUB_TOKEN is read-only on repos configured with the restricted default.
# Without this the build succeeds and the upload fails with a 403 — which
# reads as "electron-builder is broken" rather than "the token cannot do
# this". Declared at workflow level so every job in the matrix has it.
permissions:
  contents: write

jobs:
  release:
    strategy:
      # Deliberately not fail-fast: if the Mac build breaks, the Windows and
      # Linux artifacts are still worth having in the draft rather than being
      # cancelled halfway through.
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            args: --mac
          - os: windows-latest
            args: --win
          - os: ubuntu-latest
            args: --linux

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # setup-node's npm cache archives the whole of `_cacache` — including
      # `tmp/`, which is scratch space npm was never meant to get back. The
      # names in there are generated per write and are not unique across runs,
      # so a restored one eventually collides with a fresh one and the install
      # dies at:
      #
      #   npm error EEXIST: file already exists, open '<cache>/_cacache/tmp/...'
      #
      # It only bites when packages are actually downloaded, which is why it
      # stayed hidden until a release changed package-lock.json. Deleting the
      # directory keeps every other benefit of the cache: `tmp` holds nothing
      # worth restoring by definition.
      #
      # `|| true` because a runner whose cache was never restored has no such
      # directory, and that is not a failed release.
      - name: Drop the restored npm scratch directory
        shell: bash
        run: |
          # Backslashes to forward slashes: on Windows this answers a path
          # written with backslashes, which Git Bash's rm does not read as one.
          # Bash's own substitution rather than `tr`, whose argument would then
          # have to survive being escaped through YAML as well as the shell.
          cache="$(npm config get cache)"
          rm -rf "${cache//\\//}/_cacache/tmp" || true

      # The full install, Electron binary included — unlike the Dockerfile,
      # this is the one place that genuinely needs it.
      #
      # Retried because several postinstall scripts fetch binaries from
      # outside the npm registry, and those fetches time out now and then on
      # the runners. The one that has actually bitten is sharp@0.32 (pulled in
      # by @capacitor/assets, which the desktop build does not even use)
      # downloading libvips from GitHub Releases:
      #
      #   sharp: Installation error: Request timed out
      #
      # A single slow download is not a broken release. `npm ci` wipes
      # node_modules before it starts, so each attempt is clean, and the
      # registry tarballs are already in the cache by the second try.
      - name: Install dependencies
        shell: bash
        run: |
          for attempt in 1 2 3; do
            npm ci && exit 0
            echo "::warning::npm ci failed (attempt $attempt of 3), retrying in 15s"
            sleep 15
          done
          exit 1

      # esbuild bundles the shell's three entrypoints; electron-builder only
      # packages what this produces.
      - run: npm run electron:build

      # The helper is what keeps a screen share from carrying the room's own
      # voices back into it (electron/systemAudio.ts).
      #
      # --force even though a current binary is committed to the repo: what
      # ships to users should be built from the tagged source on this runner,
      # not taken on trust from git. It costs seconds, and it means the
      # installer's binary provably corresponds to the tag rather than to
      # whatever was committed to bin/ at some point.
      #
      # --required because the script otherwise warns and carries on when
      # MSVC is missing, which is right for a developer machine and wrong
      # here: the installer would go out without the feature and nothing
      # would say so until users reported the echo coming back. windows-latest
      # ships Visual Studio 2022 with the C++ workload, so this is a guard
      # rather than something expected to trip.
      - name: Build the native helpers from source
        if: runner.os == 'Windows'
        run: node electron/native/build.mjs --force --required

      - name: Type-check the shell
        run: npm run electron:typecheck

      - name: Build and publish
        # bash on all three runners (Windows included, via Git Bash) so the
        # one conditional below does not need a per-OS variant.
        shell: bash
        env:
          # Provided automatically by Actions — no secret to configure for
          # publishing to this repo's own releases.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Read under neutral names and only promoted to the ones
          # electron-builder looks at when they actually hold something —
          # see the conditional below for why that matters.
          # Separate per platform on purpose: macOS and Windows need
          # *different* certificates, and electron-builder reads them from
          # different variables (CSC_LINK for mac, WIN_CSC_LINK for Windows,
          # which falls back to CSC_LINK). One shared secret would hand the
          # Apple certificate to the Windows signer.
          MAC_CERT_BASE64: ${{ secrets.MAC_CSC_LINK }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          WIN_CERT_BASE64: ${{ secrets.WIN_CSC_LINK }}
          WIN_CERT_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          # Notarization. electron-builder picks these up on its own and
          # skips with a warning when they are absent, so nothing here needs
          # a switch — but note it throws if only *some* are set, which is a
          # good error rather than a silently unnotarized build.
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Azure Trusted Signing, which is the *other* way to sign Windows —
          # and the one that matters, because an ordinary certificate is not
          # enough for Windows 11's Smart App Control. SAC does not ask "is
          # this signed", it asks Microsoft's reputation graph "is this
          # known-good", and an unsigned or freshly-signed installer is
          # neither: it is blocked and deleted with no prompt at all, which
          # is what breaks the auto-updater (see electron/updater.ts).
          # Trusted Signing certificates chain to Microsoft's own roots and
          # are trusted immediately.
          #
          # The first three authenticate to Entra ID and are the names
          # electron-builder reads directly; the rest name the signing
          # account and are passed through on the command line below.
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_SIGN_ENDPOINT: ${{ secrets.AZURE_SIGN_ENDPOINT }}
          AZURE_SIGN_ACCOUNT: ${{ secrets.AZURE_SIGN_ACCOUNT }}
          AZURE_SIGN_PROFILE: ${{ secrets.AZURE_SIGN_PROFILE }}
          # The certificate's common name. Stated rather than derived, and
          # that is not optional here: electron-builder normally reads the CN
          # out of the certificate *file*, and with Trusted Signing there is
          # no file to read — the key never leaves Azure. Without it
          # `latest.yml` ships with no publisherName and electron-updater
          # quietly stops verifying the signature of what it downloads.
          AZURE_SIGN_PUBLISHER: ${{ secrets.AZURE_SIGN_PUBLISHER }}
        run: |
          # A missing secret in Actions is an empty string, not an absent
          # variable — so `CSC_LINK: ${{ secrets.CSC_LINK }}` sets CSC_LINK=""
          # rather than leaving it unset. electron-builder then treats that
          # empty string as a certificate *path*: path.resolve(cwd, "")
          # resolves to the repo root, which exists but is a directory, and
          # the build dies with "<repo root> not a file". Windows and Linux
          # survive it (they take a different signing path), macOS does not.
          #
          # So the certificate variables are only exported when they carry a
          # value, and macOS signing is explicitly switched off otherwise —
          # without that, electron-builder still goes looking for an identity
          # in the (empty) CI keychain.
          if [ -n "$MAC_CERT_BASE64" ]; then
            export CSC_LINK="$MAC_CERT_BASE64"
            export CSC_KEY_PASSWORD="$MAC_CERT_PASSWORD"
          else
            export CSC_IDENTITY_AUTO_DISCOVERY=false
          fi
          if [ -n "$WIN_CERT_BASE64" ]; then
            export WIN_CSC_LINK="$WIN_CERT_BASE64"
            export WIN_CSC_KEY_PASSWORD="$WIN_CERT_PASSWORD"
          fi

          # Trusted Signing has no environment-variable form for *which*
          # certificate to use — only the Entra ID credentials are read from
          # the environment, and the account itself lives under
          # `win.azureSignOptions` in the config. Passing it on the command
          # line instead of writing it into electron-builder.yml is what
          # keeps this switchable: the moment that key exists in the file,
          # every build without the Azure credentials fails outright, which
          # would take `npm run electron:dist` on a laptop with it.
          #
          # Guarded on the runner as well as the secret because Actions hands
          # every secret to every job in the matrix, and `-c.win.*` on the
          # macOS build is at best noise.
          signing=()
          if [ "$RUNNER_OS" = "Windows" ] && [ -n "$AZURE_CLIENT_ID" ]; then
            signing+=(
              "-c.win.azureSignOptions.endpoint=$AZURE_SIGN_ENDPOINT"
              "-c.win.azureSignOptions.codeSigningAccountName=$AZURE_SIGN_ACCOUNT"
              "-c.win.azureSignOptions.certificateProfileName=$AZURE_SIGN_PROFILE"
              "-c.win.publisherName=$AZURE_SIGN_PUBLISHER"
            )
          fi
          npx electron-builder ${{ matrix.args }} "${signing[@]}" --publish always
