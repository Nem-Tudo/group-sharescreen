name: Deploy Frontend

on:
  push:
    branches:
      - main

concurrency:
  group: frontend-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Frontend
    runs-on: ubuntu-latest

    timeout-minutes: 25

    steps:
      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout
        uses: actions/checkout@v4

      # ============================================================
      # CONFIGURAÇÃO
      # ============================================================

      - name: Mostrar commit
        run: |
          echo "Commit que será publicado:"
          echo "${{ github.sha }}"

      # ============================================================
      # APP 1
      # ============================================================

      - name: Definir GIT_BUILD_COMMIT_HASH da APP 1
        env:
          SQUARE_TOKEN: ${{ secrets.SQUARE_TOKEN }}
          APP_ID: ${{ secrets.SQUARE_APP_1 }}
          COMMIT_HASH: ${{ github.sha }}
        run: |
          set -e

          echo "Definindo GIT_BUILD_COMMIT_HASH da APP 1..."

          curl -fsS \
            -X POST \
            "https://api.squarecloud.app/v2/apps/$APP_ID/envs" \
            -H "Authorization: $SQUARE_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"envs\":{\"GIT_BUILD_COMMIT_HASH\":\"$COMMIT_HASH\"}}"

          echo "Variável atualizada."

      - name: Atualizar APP 1
        uses: squarecloudofc/github-action@v2
        with:
          token: ${{ secrets.SQUARE_TOKEN }}
          command: commit ${{ secrets.SQUARE_APP_1 }} --restart

      - name: Esperar APP 1 ficar pronta
        env:
          HEALTH_URL: ${{ secrets.APP_1_HEALTH_URL }}
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          set -e

          echo "Esperando APP 1 terminar o build..."
          echo "Commit esperado: $EXPECTED_COMMIT"

          for i in {1..120}; do

            response=$(curl \
              -s \
              --max-time 5 \
              "$HEALTH_URL" || true)

            echo "Tentativa $i/120"
            echo "Resposta: $response"

            if [ -n "$response" ]; then
              status=$(echo "$response" | jq -r '.status // empty')
              commit=$(echo "$response" | jq -r '.commit // empty')

              echo "Status: $status"
              echo "Commit: $commit"

              if [ "$status" = "ok" ] && [ "$commit" = "$EXPECTED_COMMIT" ]; then
                echo ""
                echo "======================================"
                echo "APP 1 está rodando o novo commit!"
                echo "Commit: $commit"
                echo "======================================"
                exit 0
              fi
            fi

            sleep 5
          done

          echo ""
          echo "======================================"
          echo "ERRO: APP 1 não ficou pronta."
          echo "Commit esperado: $EXPECTED_COMMIT"
          echo "======================================"

          exit 1

      # ============================================================
      # APP 2
      # ============================================================

      - name: Definir GIT_BUILD_COMMIT_HASH da APP 2
        env:
          SQUARE_TOKEN: ${{ secrets.SQUARE_TOKEN }}
          APP_ID: ${{ secrets.SQUARE_APP_2 }}
          COMMIT_HASH: ${{ github.sha }}
        run: |
          set -e

          echo "Definindo GIT_BUILD_COMMIT_HASH da APP 2..."

          curl -fsS \
            -X POST \
            "https://api.squarecloud.app/v2/apps/$APP_ID/envs" \
            -H "Authorization: $SQUARE_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"envs\":{\"GIT_BUILD_COMMIT_HASH\":\"$COMMIT_HASH\"}}"

          echo "Variável atualizada."

      - name: Atualizar APP 2
        uses: squarecloudofc/github-action@v2
        with:
          token: ${{ secrets.SQUARE_TOKEN }}
          command: commit ${{ secrets.SQUARE_APP_2 }} --restart

      - name: Esperar APP 2 ficar pronta
        env:
          HEALTH_URL: ${{ secrets.APP_2_HEALTH_URL }}
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          set -e

          echo "Esperando APP 2 terminar o build..."
          echo "Commit esperado: $EXPECTED_COMMIT"

          for i in {1..120}; do

            response=$(curl \
              -s \
              --max-time 5 \
              "$HEALTH_URL" || true)

            echo "Tentativa $i/120"
            echo "Resposta: $response"

            if [ -n "$response" ]; then
              status=$(echo "$response" | jq -r '.status // empty')
              commit=$(echo "$response" | jq -r '.commit // empty')

              echo "Status: $status"
              echo "Commit: $commit"

              if [ "$status" = "ok" ] && [ "$commit" = "$EXPECTED_COMMIT" ]; then
                echo ""
                echo "======================================"
                echo "APP 2 está rodando o novo commit!"
                echo "Commit: $commit"
                echo "======================================"
                exit 0
              fi
            fi

            sleep 5
          done

          echo ""
          echo "======================================"
          echo "ERRO: APP 2 não ficou pronta."
          echo "Commit esperado: $EXPECTED_COMMIT"
          echo "======================================"

          exit 1

      # ============================================================
      # FINAL
      # ============================================================

      - name: Deploy concluído
        run: |
          echo ""
          echo "======================================"
          echo "       DEPLOY CONCLUÍDO"
          echo "======================================"
          echo "Commit: ${{ github.sha }}"
          echo "APP 1: OK"
          echo "APP 2: OK"
          echo "======================================"
