name: Deploy Frontend

on:
  push:
    branches:
      - main

concurrency:
  group: frontend-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Frontend
    runs-on: ubuntu-latest

    timeout-minutes: 25

    steps:
      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history: the cleanup steps diff against the commit that is live.
          fetch-depth: 0

      # ============================================================
      # APP 1
      # ============================================================
      - name: Definir NEXT_PUBLIC_BUILD_COMMIT da APP 1
        env:
          SQUARE_TOKEN: ${{ secrets.SQUARE_TOKEN }}
          APP_ID: ${{ secrets.SQUARE_APP_1 }}
          COMMIT_HASH: ${{ github.sha }}
        run: |
          set -e

          # Commits up to this one — the build number in the site's version
          # (see next.config.ts). Needs the full history checked out above.
          BUILD_NUMBER=$(git rev-list --count HEAD)

          echo "Definindo NEXT_PUBLIC_BUILD_COMMIT e NEXT_PUBLIC_BUILD_NUMBER ($BUILD_NUMBER) da APP 1..."

          curl -fsS \
            -X POST \
            "https://api.squarecloud.app/v2/apps/$APP_ID/envs" \
            -H "Authorization: $SQUARE_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"envs\":{\"NEXT_PUBLIC_BUILD_COMMIT\":\"$COMMIT_HASH\",\"NEXT_PUBLIC_BUILD_NUMBER\":\"$BUILD_NUMBER\"}}" \
            -o /dev/null

          echo "Variável atualizada."

      # `squarecloud commit` only uploads on top of what is there and never
      # deletes, so a file removed or renamed in git would stay on the app and
      # still be compiled by its build. Diff the commit that is live (read from
      # the health endpoint) against this one and delete what is gone.
      - name: Apagar da APP 1 os arquivos removidos no git
        env:
          SQUARE_TOKEN: ${{ secrets.SQUARE_TOKEN }}
          APP_ID: ${{ secrets.SQUARE_APP_1 }}
          HEALTH_URL: ${{ secrets.APP_1_HEALTH_URL }}
        run: |
          set -e

          live=$(curl -s --max-time 10 "$HEALTH_URL" | jq -r '.commit // empty' 2>/dev/null || true)
          if [ -z "$live" ] || ! git cat-file -e "$live^{commit}" 2>/dev/null; then
            echo "::warning::Commit no ar da APP 1 desconhecido ('$live'); nada apagado."
            exit 0
          fi

          git diff --name-only --no-renames --diff-filter=D "$live" "$GITHUB_SHA" |
          while IFS= read -r path; do
            [ -z "$path" ] && continue
            echo "Apagando /$path"
            code=$(curl -s -o /tmp/delete_response -w "%{http_code}" \
              -X DELETE "https://api.squarecloud.app/v2/apps/$APP_ID/files" \
              -H "Authorization: $SQUARE_TOKEN" \
              -H "Content-Type: application/json" \
              -d "$(jq -cn --arg p "/$path" '{path: $p}')")
            if [ "$code" != "200" ]; then
              echo "::warning::Falha ao apagar /$path (HTTP $code): $(cat /tmp/delete_response)"
            fi
          done

      - name: Atualizar APP 1
        uses: squarecloudofc/github-action@v2
        with:
          token: ${{ secrets.SQUARE_TOKEN }}
          command: commit ${{ secrets.SQUARE_APP_1 }} --restart

      - name: Esperar APP 1 terminar o build
        env:
          HEALTH_URL: ${{ secrets.APP_1_HEALTH_URL }}
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          set -e

          echo "Esperando APP 1 terminar o build..."
          echo "Commit esperado: $EXPECTED_COMMIT"

          for i in {1..120}; do

            echo ""
            echo "Tentativa $i/120..."

            # Faz a requisição.
            # Qualquer erro/timeout vira HTTP 000.
            http_code=$(curl \
              -s \
              -o /tmp/health_response \
              -w "%{http_code}" \
              --max-time 10 \
              "$HEALTH_URL" || echo "000")

            # Qualquer coisa que não seja HTTP 200 é considerada offline.
            if [ "$http_code" != "200" ]; then
              echo "APP 1 está offline ou indisponível (HTTP $http_code)."
              echo "Tentando novamente em 5 segundos..."
              sleep 5
              continue
            fi

            # Tenta interpretar a resposta como JSON.
            # Se for HTML da Square Cloud, por exemplo, simplesmente ignora.
            if ! jq empty /tmp/health_response 2>/dev/null; then
              echo "Resposta não é JSON válido. Considerando APP 1 offline."
              echo "Tentando novamente em 5 segundos..."
              sleep 5
              continue
            fi

            status=$(jq -r '.status // empty' /tmp/health_response)
            commit=$(jq -r '.commit // empty' /tmp/health_response)

            echo "Status recebido: $status"
            echo "Commit recebido: $commit"

            # Só considera pronto se TODAS as condições forem satisfeitas.
            if [ "$status" = "ok" ] && [ "$commit" = "$EXPECTED_COMMIT" ]; then
              echo ""
              echo "======================================"
              echo "APP 1 está pronta!"
              echo "Commit: $commit"
              echo "======================================"

              exit 0
            fi

            echo "APP 1 ainda não está pronta."
            echo "Esperado: $EXPECTED_COMMIT"
            echo "Recebido: $commit"
            echo "Tentando novamente em 5 segundos..."

            sleep 5
          done

          echo ""
          echo "======================================"
          echo "ERRO: APP 1 não ficou pronta."
          echo "======================================"

          exit 1

      # ============================================================
      # APP 2
      # ============================================================

      - name: Definir NEXT_PUBLIC_BUILD_COMMIT da APP 2
        env:
          SQUARE_TOKEN: ${{ secrets.SQUARE_TOKEN }}
          APP_ID: ${{ secrets.SQUARE_APP_2 }}
          COMMIT_HASH: ${{ github.sha }}
        run: |
          set -e

          # Commits up to this one — the build number in the site's version
          # (see next.config.ts). Needs the full history checked out above.
          BUILD_NUMBER=$(git rev-list --count HEAD)

          echo "Definindo NEXT_PUBLIC_BUILD_COMMIT e NEXT_PUBLIC_BUILD_NUMBER ($BUILD_NUMBER) da APP 2..."

          curl -fsS \
            -X POST \
            "https://api.squarecloud.app/v2/apps/$APP_ID/envs" \
            -H "Authorization: $SQUARE_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"envs\":{\"NEXT_PUBLIC_BUILD_COMMIT\":\"$COMMIT_HASH\",\"NEXT_PUBLIC_BUILD_NUMBER\":\"$BUILD_NUMBER\"}}" \
            -o /dev/null

          echo "Variável atualizada."

      # Same cleanup as APP 1's, see there.
      - name: Apagar da APP 2 os arquivos removidos no git
        env:
          SQUARE_TOKEN: ${{ secrets.SQUARE_TOKEN }}
          APP_ID: ${{ secrets.SQUARE_APP_2 }}
          HEALTH_URL: ${{ secrets.APP_2_HEALTH_URL }}
        run: |
          set -e

          live=$(curl -s --max-time 10 "$HEALTH_URL" | jq -r '.commit // empty' 2>/dev/null || true)
          if [ -z "$live" ] || ! git cat-file -e "$live^{commit}" 2>/dev/null; then
            echo "::warning::Commit no ar da APP 2 desconhecido ('$live'); nada apagado."
            exit 0
          fi

          git diff --name-only --no-renames --diff-filter=D "$live" "$GITHUB_SHA" |
          while IFS= read -r path; do
            [ -z "$path" ] && continue
            echo "Apagando /$path"
            code=$(curl -s -o /tmp/delete_response -w "%{http_code}" \
              -X DELETE "https://api.squarecloud.app/v2/apps/$APP_ID/files" \
              -H "Authorization: $SQUARE_TOKEN" \
              -H "Content-Type: application/json" \
              -d "$(jq -cn --arg p "/$path" '{path: $p}')")
            if [ "$code" != "200" ]; then
              echo "::warning::Falha ao apagar /$path (HTTP $code): $(cat /tmp/delete_response)"
            fi
          done

      - name: Atualizar APP 2
        uses: squarecloudofc/github-action@v2
        with:
          token: ${{ secrets.SQUARE_TOKEN }}
          command: commit ${{ secrets.SQUARE_APP_2 }} --restart

      - name: Esperar APP 2 terminar o build
        env:
          HEALTH_URL: ${{ secrets.APP_2_HEALTH_URL }}
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          set -e

          echo "Esperando APP 2 terminar o build..."
          echo "Commit esperado: $EXPECTED_COMMIT"

          for i in {1..120}; do

            echo ""
            echo "Tentativa $i/120..."

            http_code=$(curl \
              -s \
              -o /tmp/health_response \
              -w "%{http_code}" \
              --max-time 10 \
              "$HEALTH_URL" || echo "000")

            if [ "$http_code" != "200" ]; then
              echo "APP 2 está offline ou indisponível (HTTP $http_code)."
              echo "Tentando novamente em 5 segundos..."
              sleep 5
              continue
            fi

            if ! jq empty /tmp/health_response 2>/dev/null; then
              echo "Resposta não é JSON válido. Considerando APP 2 offline."
              echo "Tentando novamente em 5 segundos..."
              sleep 5
              continue
            fi

            status=$(jq -r '.status // empty' /tmp/health_response)
            commit=$(jq -r '.commit // empty' /tmp/health_response)

            echo "Status recebido: $status"
            echo "Commit recebido: $commit"

            if [ "$status" = "ok" ] && [ "$commit" = "$EXPECTED_COMMIT" ]; then
              echo ""
              echo "======================================"
              echo "APP 2 está pronta!"
              echo "Commit: $commit"
              echo "======================================"

              exit 0
            fi

            echo "APP 2 ainda não está pronta."
            echo "Esperado: $EXPECTED_COMMIT"
            echo "Recebido: $commit"
            echo "Tentando novamente em 5 segundos..."

            sleep 5
          done

          echo ""
          echo "======================================"
          echo "ERRO: APP 2 não ficou pronta."
          echo "======================================"

          exit 1

      # ============================================================
      # FINAL
      # ============================================================

      - name: Deploy concluído
        run: |
          echo ""
          echo "======================================"
          echo "       DEPLOY CONCLUÍDO"
          echo "======================================"
          echo "Commit: ${{ github.sha }}"
          echo "APP 1: OK"
          echo "APP 2: OK"
          echo "======================================"
