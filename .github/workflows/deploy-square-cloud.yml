name: Deploy to Square Cloud

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run electron:build
      - run: npm run build

      # 1. Set the commit SHA as an env var on the Square Cloud app
      - name: Set build commit env var
        run: |
          curl -s -X PATCH \
            "https://api.squarecloud.app/v1/apps/${{ secrets.SQUARECLOUD_APP_ID }}/envs" \
            -H "Authorization: Bearer ${{ secrets.SQUARE_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "{\"NEXT_PUBLIC_BUILD_COMMIT\":\"${{ github.sha }}\"}"

      # 2. Deploy the built project
      - name: Deploy to Square Cloud
        uses: squarecloudofc/github-action@v2
        with:
          token: ${{ secrets.SQUARE_TOKEN }}
          command: commit --file project.zip ${{ secrets.SQUARECLOUD_APP_ID }} --restart