<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <!-- Local file with no remote anything: the CSP is restrictive because
         it can be. Thumbnails and app icons arrive as data: URLs over IPC. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; img-src data:; style-src 'unsafe-inline'; script-src 'unsafe-inline';"
    />
    <title>Escolha o que compartilhar</title>
    <style>
      :root {
        color-scheme: dark;
        /* Kept in step with the site's dark theme by hand — this page has
           no Tailwind and no way to read app/globals.css. See the
           :root[data-theme="dark"] block there. */
        --bg: #101014;
        --panel: #1a1a1f;
        --border: #313139;
        --text: #fafafa;
        --muted: #a1a1aa;
        --accent: #059669;
      }
      * { box-sizing: border-box; }
      /* The `hidden` attribute is how everything below is shown and hidden,
         and on its own it loses: the browser's own [hidden] rule is weaker
         than any id or class selector that sets a display, so #audio-panel
         would stay on screen with its own `display: flex`. */
      [hidden] { display: none !important; }
      body {
        margin: 0;
        height: 100vh;
        display: flex;
        flex-direction: column;
        /* The settings popover is positioned against this. */
        position: relative;
        background: var(--bg);
        color: var(--text);
        font: 13px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        user-select: none;
      }
      header { padding: 16px 20px 8px; }
      h1 { margin: 0; font-size: 15px; font-weight: 600; }
      p.sub { margin: 2px 0 0; font-size: 12px; color: var(--muted); }
      nav {
        display: flex;
        gap: 6px;
        padding: 10px 20px 0;
      }
      nav button {
        background: transparent;
        border: 1px solid var(--border);
        color: var(--muted);
        border-radius: 8px;
        padding: 5px 12px;
        font: inherit;
        cursor: pointer;
      }
      nav button[aria-selected="true"] {
        background: var(--text);
        border-color: var(--text);
        color: var(--bg);
        font-weight: 600;
      }
      main {
        flex: 1;
        overflow-y: auto;
        padding: 14px 20px;
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
        gap: 12px;
        align-content: start;
      }
      .empty { color: var(--muted); grid-column: 1 / -1; text-align: center; padding: 40px 0; }
      .card {
        background: var(--panel);
        border: 2px solid var(--border);
        border-radius: 10px;
        padding: 8px;
        cursor: pointer;
        text-align: left;
        color: inherit;
        font: inherit;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .card:hover { border-color: #3f3f46; }
      .card[aria-selected="true"] { border-color: var(--accent); }
      .card img.thumb {
        width: 100%;
        aspect-ratio: 16 / 10;
        object-fit: contain;
        background: #000;
        border-radius: 6px;
        display: block;
      }
      .label { display: flex; align-items: center; gap: 6px; min-width: 0; }
      .label img { width: 16px; height: 16px; flex: none; }
      .label span {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        font-size: 12px;
      }
      footer {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 12px 20px;
        border-top: 1px solid var(--border);
      }
      footer .spacer { flex: 1; }
      footer button {
        border-radius: 8px;
        padding: 8px 16px;
        font: inherit;
        font-weight: 500;
        cursor: pointer;
        border: 1px solid var(--border);
        background: transparent;
        color: var(--text);
      }
      footer button.primary {
        background: var(--accent);
        border-color: var(--accent);
        color: #fff;
      }
      footer button.primary:disabled { opacity: 0.4; cursor: not-allowed; }

      /* Audio switch and its settings ------------------------------------- */
      #audio-row { display: flex; align-items: center; gap: 4px; }
      #audio-row label {
        display: flex;
        align-items: center;
        gap: 7px;
        cursor: pointer;
        padding: 6px 4px;
      }
      #audio-row input { accent-color: var(--accent); width: 15px; height: 15px; cursor: pointer; }
      footer button.gear {
        padding: 6px;
        line-height: 0;
        border-color: transparent;
        color: var(--muted);
        border-radius: 8px;
      }
      footer button.gear:hover:not(:disabled) { border-color: var(--border); color: var(--text); }
      footer button.gear:disabled { opacity: 0.35; cursor: not-allowed; }
      footer button.gear[aria-expanded="true"] {
        border-color: var(--border);
        background: var(--panel);
        color: var(--text);
      }

      /* Clicking anywhere outside the popover closes it. Transparent rather
         than dimmed: the popover is a detail of one control, not a mode the
         whole window has entered. */
      #backdrop {
        position: fixed;
        inset: 0;
        z-index: 1;
      }
      #audio-panel {
        position: absolute;
        left: 20px;
        bottom: 60px;
        z-index: 2;
        width: 340px;
        max-height: min(360px, calc(100vh - 140px));
        display: flex;
        flex-direction: column;
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 10px;
        box-shadow: 0 12px 32px rgba(0, 0, 0, 0.55);
      }
      #audio-panel h2 {
        margin: 0;
        padding: 12px 14px 0;
        font-size: 12px;
        font-weight: 600;
      }
      #audio-panel p {
        margin: 4px 0 0;
        padding: 0 14px 10px;
        font-size: 11px;
        color: var(--muted);
        border-bottom: 1px solid var(--border);
      }
      .apps { overflow-y: auto; padding: 6px; }
      .apps .status { color: var(--muted); font-size: 12px; padding: 14px; text-align: center; }
      .app {
        display: flex;
        align-items: center;
        gap: 9px;
        width: 100%;
        padding: 7px 8px;
        border-radius: 7px;
        cursor: pointer;
      }
      .app:hover { background: #27272a80; }
      .app.locked { cursor: default; }
      .app.locked:hover { background: transparent; }
      .app input { accent-color: var(--accent); width: 15px; height: 15px; flex: none; cursor: inherit; }
      .app img { width: 18px; height: 18px; flex: none; }
      /* Keeps the names in one column whether or not an icon came back. */
      .app .noicon { width: 18px; flex: none; }
      .app .name {
        flex: 1;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        font-size: 12px;
      }
      .app .hint { color: var(--muted); font-size: 10px; flex: none; }
    </style>
  </head>
  <body>
    <header>
      <h1>Escolha o que compartilhar</h1>
      <p class="sub">O GoLive vai transmitir a tela ou janela selecionada.</p>
    </header>
    <nav>
      <button type="button" data-tab="screen" aria-selected="true">Telas</button>
      <button type="button" data-tab="window" aria-selected="false">Janelas</button>
    </nav>
    <main id="grid"></main>

    <div id="backdrop" hidden></div>
    <div id="audio-panel" hidden role="dialog" aria-label="Configurações de som">
      <h2>Não compartilhar som dos seguintes apps</h2>
      <p>Apps abertos agora. O que os marcados tocarem fica de fora da transmissão — você continua ouvindo normalmente.</p>
      <div class="apps" id="audio-apps"></div>
    </div>

    <footer>
      <div id="audio-row" hidden>
        <label>
          <input type="checkbox" id="audio-toggle" />
          <span>Compartilhar som da tela</span>
        </label>
        <button
          type="button"
          id="audio-gear"
          class="gear"
          aria-label="Configurações de som"
          aria-expanded="false"
          hidden
        >
          <!-- Inline so the restrictive CSP needs no exception for it. -->
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="3"></circle>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6h.09A1.65 1.65 0 0 0 10 3.09V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9v.09a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
          </svg>
        </button>
      </div>
      <div class="spacer"></div>
      <button type="button" id="cancel">Cancelar</button>
      <button type="button" id="confirm" class="primary" disabled>Compartilhar</button>
    </footer>

    <script>
      // No bundler runs over this file, so it is plain ES5-ish DOM code
      // against the `picker` bridge that picker-preload.ts exposes.
      (function () {
        var grid = document.getElementById("grid");
        var confirmBtn = document.getElementById("confirm");
        var audioRow = document.getElementById("audio-row");
        var audioToggle = document.getElementById("audio-toggle");
        var gear = document.getElementById("audio-gear");
        var panel = document.getElementById("audio-panel");
        var backdrop = document.getElementById("backdrop");
        var appList = document.getElementById("audio-apps");

        var sources = [];
        var tab = "screen";
        var selectedId = null;

        // The mute list, once the panel has been opened and the applications
        // have arrived. Null until then, and null is *not* "nothing is muted"
        // — it is "the user never touched this", which main answers by
        // leaving the saved list exactly as it was. Sending an empty array
        // instead would quietly un-mute everything for anyone who opens the
        // picker and shares without opening the panel, which is almost
        // everyone.
        var muted = null;
        // And what the panel actually had to show, which is only the apps
        // that were open. main edits those keys and leaves the rest of the
        // saved list alone — see PickerChoice.
        var listed = null;
        var appsLoaded = false;

        function choose(id) {
          // Guarded because "closed" also settles the request in main: a
          // double send would be answered by nobody, which is harmless but
          // worth not doing.
          if (!window.picker) return;
          var choice = { id: id };
          // Only on a real share. Cancelling calls the whole thing off,
          // including whatever was changed here on the way out.
          if (id) {
            choice.audio = { enabled: audioToggle.checked };
            if (muted) {
              choice.audio.muted = muted;
              choice.audio.listed = listed;
            }
          }
          window.picker.choose(choice);
        }

        function render() {
          var visible = sources.filter(function (s) {
            return s.kind === tab;
          });
          grid.textContent = "";
          if (visible.length === 0) {
            var empty = document.createElement("p");
            empty.className = "empty";
            empty.textContent =
              tab === "screen" ? "Nenhuma tela encontrada." : "Nenhuma janela aberta.";
            grid.appendChild(empty);
            return;
          }
          visible.forEach(function (source) {
            var card = document.createElement("button");
            card.type = "button";
            card.className = "card";
            card.setAttribute("aria-selected", String(source.id === selectedId));

            var thumb = document.createElement("img");
            thumb.className = "thumb";
            thumb.src = source.thumbnail;
            thumb.alt = "";
            card.appendChild(thumb);

            var label = document.createElement("div");
            label.className = "label";
            if (source.appIcon) {
              var icon = document.createElement("img");
              icon.src = source.appIcon;
              icon.alt = "";
              label.appendChild(icon);
            }
            var name = document.createElement("span");
            name.textContent = source.name;
            name.title = source.name;
            label.appendChild(name);
            card.appendChild(label);

            card.addEventListener("click", function () {
              selectedId = source.id;
              confirmBtn.disabled = false;
              render();
            });
            // Double-click is the gesture people expect to mean "this one,
            // go" — the confirm button stays for anyone who does not try it.
            card.addEventListener("dblclick", function () {
              choose(source.id);
            });
            grid.appendChild(card);
          });
        }

        // --- audio settings ------------------------------------------------

        function setStatus(text) {
          appList.textContent = "";
          var status = document.createElement("p");
          status.className = "status";
          status.textContent = text;
          appList.appendChild(status);
        }

        function renderApps(apps) {
          appList.textContent = "";
          if (apps.length === 0) {
            setStatus("Nenhum app aberto agora.");
            return;
          }
          apps.forEach(function (entry) {
            var row = document.createElement("label");
            row.className = "app" + (entry.locked ? " locked" : "");

            var box = document.createElement("input");
            box.type = "checkbox";
            box.checked = entry.muted;
            // GoLive's own row. Not a preference: sharing our own output is
            // what makes the room hear itself, so the switch would only ever
            // be a way to break the call.
            box.disabled = entry.locked;
            box.addEventListener("change", function () {
              if (box.checked) {
                if (muted.indexOf(entry.key) === -1) muted.push(entry.key);
              } else {
                muted = muted.filter(function (key) {
                  return key !== entry.key;
                });
              }
            });
            row.appendChild(box);

            if (entry.icon) {
              var icon = document.createElement("img");
              icon.src = entry.icon;
              icon.alt = "";
              row.appendChild(icon);
            } else {
              var placeholder = document.createElement("span");
              placeholder.className = "noicon";
              row.appendChild(placeholder);
            }

            var name = document.createElement("span");
            name.className = "name";
            name.textContent = entry.name;
            name.title = entry.name;
            row.appendChild(name);

            if (entry.locked) {
              var hint = document.createElement("span");
              hint.className = "hint";
              hint.textContent = "sempre sem som";
              hint.title =
                "O som do próprio GoLive nunca entra na transmissão — é o que evita o eco na sala.";
              row.appendChild(hint);
            }

            appList.appendChild(row);
          });
        }

        function loadApps() {
          if (appsLoaded) return;
          appsLoaded = true;
          setStatus("Procurando apps com som…");
          window.picker.audioApps().then(
            function (apps) {
              // The locked row is GoLive's own and main never stores it, so
              // it stays out of both lists — see PickerChoice.
              var switchable = apps.filter(function (entry) {
                return !entry.locked;
              });
              listed = switchable.map(function (entry) {
                return entry.key;
              });
              muted = switchable
                .filter(function (entry) {
                  return entry.muted;
                })
                .map(function (entry) {
                  return entry.key;
                });
              renderApps(apps);
            },
            function () {
              // Retryable: the list is read fresh the next time the panel is
              // opened rather than being stuck on the error.
              appsLoaded = false;
              setStatus("Não foi possível ler a lista de apps.");
            }
          );
        }

        function openPanel(open) {
          panel.hidden = !open;
          backdrop.hidden = !open;
          gear.setAttribute("aria-expanded", String(open));
          if (open) loadApps();
        }

        function syncAudioControls() {
          // Nothing to configure when the sound is not being shared at all.
          gear.disabled = !audioToggle.checked;
          if (!audioToggle.checked) openPanel(false);
        }

        gear.addEventListener("click", function () {
          openPanel(panel.hidden);
        });
        backdrop.addEventListener("click", function () {
          openPanel(false);
        });
        audioToggle.addEventListener("change", syncAudioControls);

        // --- wiring --------------------------------------------------------

        Array.prototype.forEach.call(document.querySelectorAll("nav button"), function (btn) {
          btn.addEventListener("click", function () {
            tab = btn.getAttribute("data-tab");
            Array.prototype.forEach.call(document.querySelectorAll("nav button"), function (other) {
              other.setAttribute("aria-selected", String(other === btn));
            });
            render();
          });
        });

        confirmBtn.addEventListener("click", function () {
          if (selectedId) choose(selectedId);
        });
        document.getElementById("cancel").addEventListener("click", function () {
          choose(null);
        });
        document.addEventListener("keydown", function (e) {
          // Escape closes the popover first: dismissing the whole picker
          // because someone wanted to back out of a panel would throw away
          // the source they had already chosen.
          if (e.key === "Escape" && !panel.hidden) {
            openPanel(false);
            return;
          }
          if (e.key === "Escape") choose(null);
          if (e.key === "Enter" && selectedId && panel.hidden) choose(selectedId);
        });

        window.picker.list().then(function (data) {
          sources = data.sources;
          // The surface this machine shared last, when it is still open (main
          // resolves it against this very list, so anything that arrives here
          // is real — see PickerData.selectedId). Pre-selecting it makes the
          // common case one keypress: the picker opens on the monitor you
          // always share, already chosen, and Enter confirms it.
          selectedId = data.selectedId || null;
          // Enabled here as well as on a card click, which is where it used
          // to be enabled exclusively — a pre-selected source would otherwise
          // look chosen above a Confirmar nobody could press, and the one
          // keypress this feature is for would do nothing.
          confirmBtn.disabled = !selectedId;

          audioToggle.checked = data.audio.enabled;
          audioRow.hidden = !data.audio.supported;
          // Without the native helper the choice is all of the sound or none
          // of it, so the gear would open a panel that cannot do anything.
          gear.hidden = !data.audio.perApp;
          syncAudioControls();

          // Open on the tab holding the pre-selected source, so a remembered
          // *window* is visible rather than selected behind the Telas tab
          // with nothing on screen looking chosen.
          var preselected = selectedId
            ? sources.filter(function (s) {
                return s.id === selectedId;
              })[0]
            : null;
          if (preselected && preselected.kind === "window") {
            tab = "window";
            Array.prototype.forEach.call(document.querySelectorAll("nav button"), function (b) {
              b.setAttribute("aria-selected", String(b.getAttribute("data-tab") === "window"));
            });
          }
          // Open on whichever tab actually has something in it, so a machine
          // with a single screen and many windows does not start on a view
          // that looks empty.
          if (
            !preselected &&
            !sources.some(function (s) {
              return s.kind === "screen";
            })
          ) {
            tab = "window";
            Array.prototype.forEach.call(document.querySelectorAll("nav button"), function (b) {
              b.setAttribute("aria-selected", String(b.getAttribute("data-tab") === "window"));
            });
          }
          render();
          // Brought into view after the cards exist. A remembered window can
          // be well down a long list, and a selection nobody can see is the
          // same as no selection — worse, because Enter would then confirm
          // something off screen.
          if (selectedId) {
            var chosen = document.querySelector('.card[aria-selected="true"]');
            if (chosen && chosen.scrollIntoView) {
              chosen.scrollIntoView({ block: "nearest" });
            }
          }
        });
      })();
    </script>
  </body>
</html>
