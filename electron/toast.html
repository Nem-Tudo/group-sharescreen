<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <!-- Same posture as call-overlay.html: a local file with no remote code.
         The face arrives as an https URL (our CDN, or a group's icon), the
         GoLive mark as a data: URL handed over IPC. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; img-src data: https:; style-src 'unsafe-inline'; script-src 'unsafe-inline';"
    />
    <title>GoLive</title>
    <style>
      :root {
        color-scheme: dark;
        /* The site's dark palette, by hand — same values call-overlay.html
           keeps, since neither page can read app/globals.css. */
        --bg: #0f0f13;
        --panel: #1a1a1f;
        --border: #2b2b33;
        --text: #fafafa;
        --muted: #a1a1aa;
        --accent: #10b981;
      }

      * { box-sizing: border-box; }
      [hidden] { display: none !important; }

      /* Transparent window, painted card: the card's own radius is the
         window's outline, and the padding is where its shadow lands. See the
         same note in call-overlay.html. */
      html,
      body {
        margin: 0;
        height: 100%;
        background: transparent;
        overflow: hidden;
      }
      body {
        display: flex;
        align-items: flex-end;
        justify-content: flex-end;
        padding: 12px;
        color: var(--text);
        font: 13px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        user-select: none;
      }

      /* The whole card is the button: a notification is clicked to open what
         it is about, and making somebody aim for a smaller target inside a
         box that is already small is a worse notification. */
      #card {
        position: relative;
        width: 100%;
        display: flex;
        gap: 12px;
        align-items: flex-start;
        padding: 12px 34px 14px 12px;
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: 14px;
        box-shadow: 0 16px 36px rgba(0, 0, 0, 0.5);
        overflow: hidden;
        cursor: pointer;
        /* In from the right edge, the way the corner it lives in suggests —
           and out the same way (see .leaving). */
        animation: arrive 320ms cubic-bezier(0.22, 1, 0.36, 1) both;
        transition: background-color 0.15s, border-color 0.15s;
      }
      #card:hover {
        background: var(--panel);
        border-color: #3a3a44;
      }
      #card.leaving {
        animation: leave 220ms cubic-bezier(0.4, 0, 1, 1) both;
      }
      /* A replacement arriving while one is up: a small nudge rather than the
         whole entrance again, so a burst of messages reads as one card being
         updated instead of cards being thrown at the screen. */
      #card.bump {
        animation: bump 260ms cubic-bezier(0.22, 1, 0.36, 1);
      }

      @keyframes arrive {
        from {
          opacity: 0;
          transform: translateX(calc(100% + 24px));
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      @keyframes leave {
        to {
          opacity: 0;
          transform: translateX(calc(100% + 24px));
        }
      }
      @keyframes bump {
        0% {
          transform: none;
        }
        40% {
          transform: translateX(-6px);
        }
        100% {
          transform: none;
        }
      }

      /* The face, with the initial drawn behind it — a missing or broken
         image simply reveals it. Same trick as the ringing window. */
      #face {
        position: relative;
        width: 44px;
        height: 44px;
        flex: none;
      }
      #initial {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 50%;
        background: var(--panel);
        color: var(--muted);
        font-size: 18px;
        font-weight: 600;
      }
      #icon {
        position: absolute;
        inset: 0;
        width: 44px;
        height: 44px;
        border-radius: 50%;
        object-fit: cover;
      }
      /* The GoLive mark, pinned to the face's corner like Discord's badge —
         says which app this is without spending a header row on it. */
      #logo {
        position: absolute;
        right: -3px;
        bottom: -3px;
        width: 18px;
        height: 18px;
        border-radius: 5px;
        border: 2px solid var(--bg);
        background: var(--bg);
      }

      #text {
        min-width: 0;
        flex: 1;
        padding-top: 1px;
      }
      #title {
        margin: 0;
        font-size: 13.5px;
        font-weight: 650;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      #body {
        margin: 3px 0 0;
        color: var(--muted);
        font-size: 12.5px;
        /* Two lines and an ellipsis: enough to read the message, never enough
           to turn a corner notification into a window. */
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
        word-break: break-word;
      }

      #close {
        position: absolute;
        top: 8px;
        right: 8px;
        width: 22px;
        height: 22px;
        display: flex;
        align-items: center;
        justify-content: center;
        border: 0;
        border-radius: 6px;
        background: transparent;
        color: var(--muted);
        cursor: pointer;
        opacity: 0;
        transition: opacity 0.15s, background-color 0.15s, color 0.15s;
      }
      #card:hover #close,
      #close:focus-visible {
        opacity: 1;
      }
      #close:hover {
        background: var(--border);
        color: var(--text);
      }
      #close svg {
        width: 14px;
        height: 14px;
        fill: currentColor;
      }

      /* How long it has left, drawn along the bottom edge. Paused while the
         pointer is on the card — see the script. */
      #timer {
        position: absolute;
        left: 0;
        bottom: 0;
        height: 2px;
        width: 100%;
        background: var(--accent);
        opacity: 0.7;
        transform-origin: left;
      }

      @media (prefers-reduced-motion: reduce) {
        #card,
        #card.leaving,
        #card.bump {
          animation-duration: 1ms;
        }
      }
    </style>
  </head>
  <body>
    <div id="card" role="alert">
      <span id="face">
        <span id="initial"></span>
        <img id="icon" alt="" />
        <img id="logo" alt="" />
      </span>
      <div id="text">
        <p id="title"></p>
        <p id="body"></p>
      </div>
      <button id="close" type="button" aria-label="Fechar">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path
            d="M19 6.41 17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"
          />
        </svg>
      </button>
      <span id="timer"></span>
    </div>

    <script>
      const toast = window.goliveToast;
      const card = document.getElementById("card");
      const timer = document.getElementById("timer");

      // How long one stays up. Long enough to read two lines of a message,
      // short enough that a burst does not leave the corner occupied.
      const VISIBLE_MS = 6000;

      let shownId = null;
      // Remaining time, so hovering pauses the countdown rather than
      // restarting it — a card somebody is reading must not vanish under the
      // pointer, and one they let go of should not get a fresh six seconds.
      let remaining = VISIBLE_MS;
      let startedAt = 0;
      let deadline = null;
      let leaving = false;

      function stopCountdown() {
        if (deadline === null) return;
        clearTimeout(deadline);
        deadline = null;
        remaining = Math.max(0, remaining - (Date.now() - startedAt));
        const done = 1 - remaining / VISIBLE_MS;
        timer.style.transition = "none";
        timer.style.transform = `scaleX(${Math.max(0, 1 - done)})`;
      }

      function startCountdown() {
        if (leaving) return;
        startedAt = Date.now();
        // Two frames: the first commits the current width, the second
        // animates from it. In one, the browser would skip straight to zero.
        requestAnimationFrame(() => {
          timer.style.transition = `transform ${remaining}ms linear`;
          timer.style.transform = "scaleX(0)";
        });
        deadline = setTimeout(() => leave("dismiss"), remaining);
      }

      // Plays the exit, then tells main — which closes the window only once
      // the card is off screen, so it never blinks out mid-animation.
      function leave(action) {
        if (leaving || !shownId) return;
        leaving = true;
        stopCountdown();
        const id = shownId;
        card.classList.remove("bump");
        card.classList.add("leaving");
        setTimeout(() => toast.act({ action, id }), action === "click" ? 0 : 200);
      }

      card.addEventListener("click", () => leave("click"));
      document.getElementById("close").addEventListener("click", (event) => {
        event.stopPropagation();
        leave("dismiss");
      });
      card.addEventListener("mouseenter", stopCountdown);
      card.addEventListener("mouseleave", startCountdown);

      function render(data) {
        if (!data || !data.toast) return;
        const { toast: info, logo } = data;
        const replacing = shownId !== null;
        shownId = info.id;
        leaving = false;
        card.classList.remove("leaving");

        document.getElementById("title").textContent = info.title;
        const body = document.getElementById("body");
        body.textContent = info.body || "";
        body.hidden = !info.body;
        // Codepoint-aware, so an emoji or an accented letter stays whole.
        document.getElementById("initial").textContent =
          [...info.title][0]?.toUpperCase() ?? "?";
        const icon = document.getElementById("icon");
        icon.hidden = !info.icon;
        icon.src = info.icon || "";
        const mark = document.getElementById("logo");
        mark.hidden = !logo;
        if (logo) mark.src = logo;

        // A fresh card gets the entrance (the CSS default); one replacing a
        // card already up gets the nudge instead, retriggered by reflow.
        if (replacing) {
          card.classList.remove("bump");
          void card.offsetWidth;
          card.classList.add("bump");
        }

        stopCountdown();
        remaining = VISIBLE_MS;
        timer.style.transition = "none";
        timer.style.transform = "scaleX(1)";
        if (!card.matches(":hover")) startCountdown();
      }

      toast.data().then(render);
      toast.onUpdate(render);
    </script>
  </body>
</html>
