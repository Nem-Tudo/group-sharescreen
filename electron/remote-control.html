<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <!-- Local file with no remote anything, same posture as call-overlay.html:
         the avatar is an https URL from our CDN, the mark a data: URL. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; img-src data: https:; style-src 'unsafe-inline'; script-src 'unsafe-inline';"
    />
    <title>Go Live</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0f0f13;
        --border: #2b2b33;
        --text: #fafafa;
        --muted: #a1a1aa;
        --blue: #2563eb;
        --blue-hover: #3b82f6;
        --red: #dc2626;
        --red-hover: #ef4444;
        --neutral: #27272a;
        --neutral-hover: #3f3f46;
      }
      * { box-sizing: border-box; }
      [hidden] { display: none !important; }
      html, body { margin: 0; height: 100%; background: transparent; }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 12px;
        color: var(--text);
        font: 13px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        user-select: none;
        overflow: hidden;
      }
      button {
        font: inherit;
        font-weight: 600;
        border: 0;
        border-radius: 10px;
        cursor: pointer;
        color: #fff;
        transition: background 120ms, opacity 120ms;
      }
      button:disabled { opacity: 0.45; cursor: default; }

      /* ── Consent ─────────────────────────────────────────────────────── */
      #consent {
        width: 100%;
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: 16px;
        box-shadow: 0 18px 40px rgba(0, 0, 0, 0.55);
        overflow: hidden;
        animation: appear 220ms cubic-bezier(0.2, 0.9, 0.3, 1.2) both;
      }
      @keyframes appear {
        from { opacity: 0; transform: scale(0.94) translateY(8px); }
        to { opacity: 1; transform: none; }
      }
      header {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 10px 14px;
        border-bottom: 1px solid var(--border);
        background: linear-gradient(90deg, rgba(37, 99, 235, 0.2), transparent 65%);
        -webkit-app-region: drag;
      }
      .logo { width: 18px; height: 18px; border-radius: 4px; flex: none; }
      #brand { font-size: 12px; font-weight: 700; letter-spacing: 0.02em; }
      #kindLabel {
        margin-left: auto;
        font-size: 11px;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.08em;
      }
      #who { display: flex; align-items: center; gap: 13px; padding: 16px 16px 6px; min-width: 0; }
      .face { position: relative; width: 48px; height: 48px; flex: none; }
      .face .initial, .face img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        border-radius: 50%;
      }
      .face .initial {
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--blue);
        font-weight: 700;
        font-size: 18px;
      }
      .face img { object-fit: cover; }
      #names { min-width: 0; }
      #name { font-size: 15px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      #handle { color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      #question { padding: 6px 16px 0; font-size: 14px; }
      #details { margin: 8px 16px 0; padding: 0; list-style: none; color: var(--muted); font-size: 12px; }
      #details li { display: flex; gap: 6px; }
      #details li::before { content: "•"; color: var(--blue-hover); }
      #actions { display: flex; gap: 8px; padding: 14px 16px 16px; }
      #actions button { flex: 1; padding: 10px 12px; }
      #decline { background: var(--neutral); }
      #decline:hover { background: var(--neutral-hover); }
      #allow { background: var(--blue); }
      #allow:not(:disabled):hover { background: var(--blue-hover); }
      #permsTitle { margin: 12px 16px 6px; font-size: 11px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }
      #perms {
        margin: 0 16px;
        border: 1px solid var(--border);
        border-radius: 10px;
        overflow: hidden;
      }
      .perm {
        display: flex;
        align-items: flex-start;
        gap: 9px;
        padding: 7px 10px;
        font-size: 12px;
        cursor: pointer;
      }
      .perm + .perm { border-top: 1px solid var(--border); }
      .perm:hover { background: rgba(255, 255, 255, 0.03); }
      .perm input { margin: 2px 0 0; accent-color: var(--blue); flex: none; }
      .perm small { display: block; color: var(--muted); font-size: 11px; }
      #needOne { margin: 6px 16px 0; color: #fca5a5; font-size: 11px; }
      #blockRow { display: flex; align-items: center; gap: 6px; padding: 0 16px 14px; margin-top: -6px; font-size: 12px; }
      #blockToggle {
        background: none;
        color: var(--muted);
        font-weight: 500;
        padding: 0;
        text-decoration: underline;
        text-underline-offset: 2px;
      }
      #blockToggle:hover { color: var(--text); }
      #blockChoices { display: flex; align-items: center; gap: 6px; }
      #blockChoices span { color: var(--muted); }
      #blockChoices button { background: var(--neutral); padding: 4px 10px; border-radius: 8px; font-size: 12px; }
      #blockChoices button:hover { background: var(--red); }

      /* ── Banner ──────────────────────────────────────────────────────── */
      #banner {
        display: flex;
        align-items: center;
        gap: 10px;
        width: 100%;
        padding: 7px 8px 7px 10px;
        background: var(--bg);
        border: 1px solid rgba(59, 130, 246, 0.6);
        border-radius: 999px;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5), 0 0 0 3px rgba(37, 99, 235, 0.18);
        -webkit-app-region: drag;
      }
      #banner .face { width: 26px; height: 26px; }
      #banner .face .initial { font-size: 12px; }
      .dot {
        width: 8px; height: 8px; border-radius: 50%; background: var(--red-hover); flex: none;
        animation: pulse 1.6s ease-in-out infinite;
      }
      @keyframes pulse { 50% { opacity: 0.35; } }
      #bannerText { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      #bannerText b { font-weight: 700; }
      #hotkey { color: var(--muted); font-size: 11px; white-space: nowrap; }
      /* The banner's switches: what is allowed right now, changeable here. */
      #bannerPerms { display: flex; gap: 4px; -webkit-app-region: no-drag; }
      #bannerPerms button {
        display: flex;
        align-items: center;
        gap: 4px;
        padding: 4px 8px;
        border-radius: 999px;
        font-size: 11px;
        font-weight: 600;
        background: var(--neutral);
        color: var(--muted);
        text-decoration: line-through;
      }
      #bannerPerms button[aria-pressed="true"] { background: rgba(37, 99, 235, 0.25); color: var(--text); text-decoration: none; }
      #bannerPerms button:hover { background: var(--neutral-hover); }
      #bannerPerms svg { width: 13px; height: 13px; flex: none; }
      kbd {
        font: inherit;
        padding: 1px 5px;
        border: 1px solid var(--border);
        border-bottom-width: 2px;
        border-radius: 5px;
      }
      #stop { -webkit-app-region: no-drag; background: var(--red); padding: 6px 14px; border-radius: 999px; }
      #stop:hover { background: var(--red-hover); }
    </style>
  </head>
  <body>
    <section id="consent" hidden>
      <header>
        <img class="logo" alt="" hidden />
        <span id="brand">Go Live</span>
        <span id="kindLabel"></span>
      </header>
      <div id="who">
        <div class="face"><span class="initial"></span><img alt="" hidden /></div>
        <div id="names"><div id="name"></div><div id="handle"></div></div>
      </div>
      <div id="question"></div>
      <ul id="details"></ul>
      <div id="permsTitle"></div>
      <div id="perms"></div>
      <p id="needOne" hidden></p>
      <div id="actions">
        <button id="decline" type="button"></button>
        <button id="allow" type="button" disabled></button>
      </div>
      <div id="blockRow" hidden>
        <button id="blockToggle" type="button"></button>
        <div id="blockChoices" hidden>
          <span id="blockLabel"></span>
          <button id="blockHour" type="button"></button>
          <button id="blockForever" type="button"></button>
        </div>
      </div>
    </section>

    <section id="banner" hidden>
      <span class="dot"></span>
      <div class="face"><span class="initial"></span><img alt="" hidden /></div>
      <div id="bannerText"></div>
      <div id="bannerPerms"></div>
      <span id="hotkey"><kbd>Ctrl</kbd>+<kbd>Alt</kbd>+<kbd>Esc</kbd></span>
      <button id="stop" type="button"></button>
    </section>

    <script>
      // The words live here, not in anything the page hands over: the page
      // may ask for a session, but it does not get to say what the buttons
      // say. {name} is put in as text, never as HTML.
      const TEXT = {
        pt: {
          kindRequest: "Pedido de controle",
          kindOffer: "Dar controle",
          request: "quer controlar seu computador.",
          offer: "vai poder controlar seu computador.",
          details: [
            "Na tela que você está compartilhando. Janelas de administrador ficam sempre de fora.",
            "Se você mexer no mouse, você tem prioridade.",
            "Para parar a qualquer momento: Ctrl+Alt+Esc ou o botão Parar.",
          ],
          permsTitle: "O que a pessoa pode fazer",
          perms: {
            mouse: ["Usar o mouse", ""],
            keyboard: ["Usar o teclado", ""],
            clipboard: ["Copiar e colar entre os computadores", "Só texto, e só o que for copiado a partir de agora."],
            app: ["Mexer no Go Live também", "Esta janela e o botão Parar, nunca."],
            lockOnEnd: ["Bloquear o Windows quando a sessão acabar", "Pede sua senha para voltar a usar o computador."],
          },
          needOne: "Libere pelo menos o mouse ou o teclado.",
          live: { mouse: "Mouse", keyboard: "Teclado", clipboard: "Copiar e colar" },
          liveHint: "Clique para liberar ou bloquear durante a sessão",
          allow: "Permitir",
          allowIn: "Permitir ({s})",
          decline: "Recusar",
          blockToggle: "Bloquear pedidos dessa pessoa",
          blockLabel: "Bloquear:",
          blockHour: "Por 1 hora",
          blockForever: "Sempre",
          banner: "<b></b> está controlando este computador",
          stop: "Parar",
        },
        en: {
          kindRequest: "Control request",
          kindOffer: "Give control",
          request: "wants to control your computer.",
          offer: "will be able to control your computer.",
          details: [
            "On the screen you are sharing. Administrator windows always stay out of reach.",
            "If you move your mouse, you take priority.",
            "To stop at any time: Ctrl+Alt+Esc or the Stop button.",
          ],
          permsTitle: "What they can do",
          perms: {
            mouse: ["Use the mouse", ""],
            keyboard: ["Use the keyboard", ""],
            clipboard: ["Copy and paste between the computers", "Text only, and only what is copied from now on."],
            app: ["Use Go Live too", "This window and the Stop button, never."],
            lockOnEnd: ["Lock Windows when the session ends", "Your password is needed to use the computer again."],
          },
          needOne: "Allow at least the mouse or the keyboard.",
          live: { mouse: "Mouse", keyboard: "Keyboard", clipboard: "Copy & paste" },
          liveHint: "Click to allow or block during the session",
          allow: "Allow",
          allowIn: "Allow ({s})",
          decline: "Decline",
          blockToggle: "Block requests from this person",
          blockLabel: "Block:",
          blockHour: "For 1 hour",
          blockForever: "Always",
          banner: "<b></b> is controlling this computer",
          stop: "Stop",
        },
        es: {
          kindRequest: "Solicitud de control",
          kindOffer: "Dar control",
          request: "quiere controlar tu computadora.",
          offer: "podrá controlar tu computadora.",
          details: [
            "En la pantalla que estás compartiendo. Las ventanas de administrador siempre quedan fuera.",
            "Si mueves tu mouse, tienes prioridad.",
            "Para detener en cualquier momento: Ctrl+Alt+Esc o el botón Detener.",
          ],
          permsTitle: "Lo que puede hacer",
          perms: {
            mouse: ["Usar el mouse", ""],
            keyboard: ["Usar el teclado", ""],
            clipboard: ["Copiar y pegar entre las computadoras", "Solo texto, y solo lo que se copie a partir de ahora."],
            app: ["Usar Go Live también", "Esta ventana y el botón Detener, nunca."],
            lockOnEnd: ["Bloquear Windows cuando termine la sesión", "Se pedirá tu contraseña para volver a usar la computadora."],
          },
          needOne: "Permite al menos el mouse o el teclado.",
          live: { mouse: "Mouse", keyboard: "Teclado", clipboard: "Copiar y pegar" },
          liveHint: "Haz clic para permitir o bloquear durante la sesión",
          allow: "Permitir",
          allowIn: "Permitir ({s})",
          decline: "Rechazar",
          blockToggle: "Bloquear solicitudes de esta persona",
          blockLabel: "Bloquear:",
          blockHour: "Por 1 hora",
          blockForever: "Siempre",
          banner: "<b></b> está controlando esta computadora",
          stop: "Detener",
        },
      };
      // A click already on its way when the window appears must not land on
      // "Permitir" — the same reason browsers hold their permission prompts
      // for a moment.
      const ARM_DELAY_MS = 900;

      function fillFace(root, data) {
        // ".face img", not the first img: in the prompt that is the Go Live
        // logo in the header, which then showed the person's picture while
        // the circle beside their name was left with only the initial.
        const initial = root.querySelector(".face .initial");
        const img = root.querySelector(".face img");
        initial.textContent = (Array.from(data.name)[0] || "?").toUpperCase();
        if (data.avatar) {
          img.src = data.avatar;
          img.hidden = false;
          img.onerror = () => {
            img.hidden = true;
          };
        }
      }

      function showConsent(data, t) {
        const root = document.getElementById("consent");
        root.hidden = false;
        if (data.logo) {
          const logo = root.querySelector(".logo");
          logo.src = data.logo;
          logo.hidden = false;
        }
        document.getElementById("kindLabel").textContent = data.kind === "offer" ? t.kindOffer : t.kindRequest;
        fillFace(root, data);
        document.getElementById("name").textContent = data.name;
        document.getElementById("handle").textContent = data.handle ? "@" + data.handle : "";
        document.getElementById("question").textContent = data.kind === "offer" ? t.offer : t.request;
        const details = document.getElementById("details");
        for (const line of t.details) {
          const li = document.createElement("li");
          li.textContent = line;
          details.appendChild(li);
        }
        // What goes through: ticked here, by the person at this computer —
        // the page has no say in any of it. They start as they were left last
        // time (main keeps them).
        const perms = Object.assign({}, data.perms);
        document.getElementById("permsTitle").textContent = t.permsTitle;
        const list = document.getElementById("perms");
        for (const key of ["mouse", "keyboard", "clipboard", "app", "lockOnEnd"]) {
          const row = document.createElement("label");
          row.className = "perm";
          const box = document.createElement("input");
          box.type = "checkbox";
          box.checked = perms[key] === true;
          box.addEventListener("change", () => {
            perms[key] = box.checked;
            updateAllow();
          });
          const text = document.createElement("span");
          const [title, hint] = t.perms[key];
          text.append(title);
          if (hint) {
            const small = document.createElement("small");
            small.textContent = hint;
            text.append(small);
          }
          row.append(box, text);
          list.append(row);
        }
        const needOne = document.getElementById("needOne");
        needOne.textContent = t.needOne;
        let armed = false;
        // A yes needs something to say yes to: the mouse, the keyboard, or both.
        const updateAllow = () => {
          const some = perms.mouse === true || perms.keyboard === true;
          needOne.hidden = some;
          allow.disabled = !armed || !some;
        };
        const allow = document.getElementById("allow");
        const decline = document.getElementById("decline");
        decline.textContent = t.decline;
        let left = data.timeoutSeconds;
        const label = () => {
          allow.textContent = left > 0 && left <= 10 ? t.allowIn.replace("{s}", String(left)) : t.allow;
        };
        label();
        setInterval(() => {
          left -= 1;
          label();
        }, 1000);
        setTimeout(() => {
          armed = true;
          updateAllow();
        }, ARM_DELAY_MS);
        updateAllow();
        let answered = false;
        const choose = (choice, extra) => {
          if (answered) return;
          answered = true;
          window.goliveRemoteControl.choose(choice, extra);
        };
        allow.addEventListener("click", () => {
          if (!allow.disabled) choose("allow", { perms });
        });
        decline.addEventListener("click", () => choose("decline"));
        // Blocking is about somebody asking; an offer is this person's own.
        if (data.kind !== "offer") {
          document.getElementById("blockRow").hidden = false;
          const toggle = document.getElementById("blockToggle");
          toggle.textContent = t.blockToggle;
          document.getElementById("blockLabel").textContent = t.blockLabel;
          document.getElementById("blockHour").textContent = t.blockHour;
          document.getElementById("blockForever").textContent = t.blockForever;
          toggle.addEventListener("click", () => {
            toggle.hidden = true;
            document.getElementById("blockChoices").hidden = false;
          });
          document.getElementById("blockHour").addEventListener("click", () => choose("block-hour"));
          document.getElementById("blockForever").addEventListener("click", () => choose("block-forever"));
        }
        document.addEventListener("keydown", (event) => {
          // Esc declines. Enter deliberately does nothing: a yes has to be a
          // click on the button that says so.
          if (event.key === "Escape") choose("decline");
        });
      }

      function showBanner(data, t) {
        const root = document.getElementById("banner");
        root.hidden = false;
        fillFace(root, data);
        const text = document.getElementById("bannerText");
        const [before, after] = t.banner.split("<b></b>");
        const bold = document.createElement("b");
        bold.textContent = data.name;
        text.append(before, bold, after);
        // The switches: mouse, keyboard, copy and paste — on or off right now,
        // for the person here to change without ending the session.
        const ICONS = {
          mouse: "M12 2a6 6 0 0 0-6 6v8a6 6 0 0 0 12 0V8a6 6 0 0 0-6-6zm0 2a4 4 0 0 1 4 4v1h-3V4.13A4 4 0 0 1 12 4zm-1 .13V9H8V8a4 4 0 0 1 3-3.87zM8 11h8v5a4 4 0 0 1-8 0z",
          keyboard: "M3 6h18a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1zm1 2v8h16V8zm2 1h2v2H6zm3 0h2v2H9zm3 0h2v2h-2zm3 0h2v2h-2zM7 13h10v2H7z",
          clipboard: "M9 2h6a1 1 0 0 1 1 1v1h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2V3a1 1 0 0 1 1-1zm1 2v2h4V4zM6 6v14h12V6h-2v2H8V6z",
        };
        const live = Object.assign({}, data.perms);
        const holder = document.getElementById("bannerPerms");
        for (const key of ["mouse", "keyboard", "clipboard"]) {
          const button = document.createElement("button");
          button.type = "button";
          button.title = t.liveHint;
          const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
          svg.setAttribute("viewBox", "0 0 24 24");
          svg.setAttribute("fill", "currentColor");
          const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
          path.setAttribute("d", ICONS[key]);
          svg.append(path);
          button.append(svg, t.live[key]);
          const paint = () => button.setAttribute("aria-pressed", live[key] ? "true" : "false");
          paint();
          button.addEventListener("click", () => {
            live[key] = !live[key];
            paint();
            window.goliveRemoteControl.choose("perm", { key, on: live[key] });
          });
          holder.append(button);
        }
        const stop = document.getElementById("stop");
        stop.textContent = t.stop;
        stop.addEventListener("click", () => window.goliveRemoteControl.choose("stop"));
      }

      window.goliveRemoteControl.data().then((data) => {
        if (!data) return;
        const t = TEXT[data.lang] || TEXT.pt;
        document.documentElement.lang = data.lang === "en" ? "en" : data.lang === "es" ? "es" : "pt-BR";
        if (data.mode === "consent") showConsent(data, t);
        else showBanner(data, t);
      });
    </script>
  </body>
</html>
