<svg xmlns="http://www.w3.org/2000/svg" width="74.25mm" height="105mm" viewBox="0 0 742.5 1050">
  <defs>
    <!-- PlanBand band for Pro Ultra: from-rose-500 via-rose-700 to-red-950 -->
    <linearGradient id="band" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f43f5e"/>
      <stop offset="0.5" stop-color="#be123c"/>
      <stop offset="1" stop-color="#450a0a"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <!-- Ruby verified badge, same gradients as components/icons.tsx -->
    <linearGradient id="bo" gradientUnits="userSpaceOnUse" x1="4.411" x2="18.083" y1="2.495" y2="21.508">
      <stop offset="0" stop-color="#e0115f"/><stop offset=".539" stop-color="#9b111e"/>
      <stop offset=".68" stop-color="#8a0f1b"/><stop offset="1" stop-color="#d4145a"/>
    </linearGradient>
    <linearGradient id="bi" gradientUnits="userSpaceOnUse" x1="5.355" x2="16.361" y1="3.395" y2="19.133">
      <stop offset="0" stop-color="#f25c7a"/><stop offset=".406" stop-color="#b3122b"/><stop offset=".989" stop-color="#b3122b"/>
    </linearGradient>
    <clipPath id="card"><rect width="742.5" height="1050"/></clipPath>
  </defs>

  <rect width="742.5" height="1050" fill="#ffffff"/>

  <!-- Band -->
  <g clip-path="url(#card)">
    <rect width="742.5" height="400" fill="url(#band)"/>
    <rect x="263" y="0" width="70" height="400" fill="#fff" opacity="0.15"/>
    <rect x="0" y="165" width="742.5" height="70" fill="#fff" opacity="0.15"/>
    <polygon points="430,0 560,0 460,400 330,400" fill="url(#shine)"/>
    <circle cx="371.25" cy="200" r="72" fill="#fff" fill-opacity="0.2" stroke="#fff" stroke-opacity="0.4" stroke-width="2.5"/>
    <g transform="translate(323.25 152) scale(4)" fill="#fff">
      <path d="M20 6h-2.18c.11-.31.18-.65.18-1a2.996 2.996 0 0 0-5.5-1.65l-.5.67-.5-.68C10.96 2.54 10.05 2 9 2 7.34 2 6 3.34 6 5c0 .35.07.69.18 1H4c-1.11 0-1.99.89-1.99 2L2 19c0 1.11.89 2 2 2h16c1.11 0 2-.89 2-2V8c0-1.11-.89-2-2-2m-5-2c.55 0 1 .45 1 1s-.45 1-1 1-1-.45-1-1 .45-1 1-1M9 4c.55 0 1 .45 1 1s-.45 1-1 1-1-.45-1-1 .45-1 1-1m11 15H4v-2h16zm0-5H4V8h5.08L7 10.83 8.62 12 11 8.76l1-1.36 1 1.36L15.38 12 17 10.83 14.92 8H20z"/>
    </g>
  </g>

  <g font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" text-anchor="middle">
    <text x="371.25" y="478" font-size="22" font-weight="600" letter-spacing="6" fill="#a1a1aa">VOCÊ RECEBEU UM PRESENTE</text>

    <!-- Title + badge -->
    <text x="335.8" y="562" font-size="66" font-weight="700" letter-spacing="-1.5" fill="#09090b">Pro Ultra</text>
    <g transform="translate(499.8 511) scale(2.6)">
      <path fill-rule="evenodd" fill="url(#bo)" d="M13.324 3.848L11 1.6 8.676 3.848l-3.201-.453-.559 3.184L2.06 8.095 3.48 11l-1.42 2.904 2.856 1.516.559 3.184 3.201-.452L11 20.4l2.324-2.248 3.201.452.559-3.184 2.856-1.516L18.52 11l1.42-2.905-2.856-1.516-.559-3.184zm-7.09 7.575l3.428 3.428 5.683-6.206-1.347-1.247-4.4 4.795-2.072-2.072z"/>
      <path fill-rule="evenodd" fill="url(#bi)" d="M13.101 4.533L11 2.5 8.899 4.533l-2.895-.41-.505 2.88-2.583 1.37L4.2 11l-1.284 2.627 2.583 1.37.505 2.88 2.895-.41L11 19.5l2.101-2.033 2.895.41.505-2.88 2.583-1.37L17.8 11l1.284-2.627-2.583-1.37-.505-2.88zm-6.868 6.89l3.429 3.428 5.683-6.206-1.347-1.247-4.4 4.795-2.072-2.072z"/>
      <path fill="#7a0c18" d="M6.233 11.423l3.429 3.428 5.65-6.17.038-.033-.005 1.398-5.683 6.206-3.429-3.429-.003-1.405.005.003z"/>
    </g>

    <!-- Pill -->
    <rect x="266.25" y="592" width="210" height="46" rx="23" fill="#f4f4f5"/>
    <text x="371.25" y="623" font-size="22" font-weight="500" fill="#3f3f46">GoLive</text>

    <!-- Code field, drawn like the "De" card in the modal -->
    <rect x="60" y="680" width="622.5" height="130" rx="28" fill="#fafafa" stroke="#e4e4e7" stroke-width="2.5"/>
    <text x="371.25" y="716" font-size="17" font-weight="600" letter-spacing="4" fill="#a1a1aa">CÓDIGO</text>
    <!--CODE-->

    <!-- Redeem, drawn like the modal's button -->
    <rect x="60" y="850" width="622.5" height="92" rx="22" fill="#9f1239"/>
    <text x="371.25" y="887" font-size="19" font-weight="500" fill="#fff" fill-opacity="0.8">Resgate em</text>
    <text x="371.25" y="921" font-size="28" font-weight="700" fill="#fff">golive.nemtudo.me/redeem</text>

    <text x="371.25" y="995" font-size="18" fill="#a1a1aa">Alguém pensou em você. Aproveite.</text>
  </g>
