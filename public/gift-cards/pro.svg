<svg xmlns="http://www.w3.org/2000/svg" width="74.25mm" height="105mm" viewBox="0 0 742.5 1050">
  <defs>
    <!-- PlanBand band for Pro: from-sky-400 via-blue-500 to-indigo-600 -->
    <linearGradient id="band" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="0.5" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#4f46e5"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <!-- Verified badge gradients, as in components/icons.tsx -->
    <linearGradient id="bo" gradientUnits="userSpaceOnUse" x1="4.411" x2="18.083" y1="2.495" y2="21.508">
