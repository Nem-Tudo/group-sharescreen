<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <!-- "Festa · 3 Meses": Go Live's 3-month avatar decoration. The face sits
       in the middle (radius 50 of this 120 box); everything here is around it. -->
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fde68a"/>
      <stop offset="0.5" stop-color="#f59e0b"/>
      <stop offset="1" stop-color="#fbbf24"/>
    </linearGradient>
    <linearGradient id="balloon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a5b4fc"/>
      <stop offset="0.55" stop-color="#c026d3"/>
      <stop offset="1" stop-color="#fb7185"/>
    </linearGradient>
  </defs>

  <!-- Gold ring -->
  <circle cx="60" cy="60" r="53.5" fill="none" stroke="url(#gold)" stroke-width="4"/>

  <!-- Confetti streamer, turning slowly around the face -->
  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 60 60" to="360 60 60" dur="18s" repeatCount="indefinite"/>
    <circle cx="60" cy="60" r="57.5" fill="none" stroke="#f43f5e" stroke-width="3" stroke-dasharray="5 13" stroke-linecap="round"/>
    <circle cx="60" cy="60" r="57.5" fill="none" stroke="#38bdf8" stroke-width="3" stroke-dasharray="5 13" stroke-dashoffset="6" stroke-linecap="round"/>
    <circle cx="60" cy="60" r="57.5" fill="none" stroke="#34d399" stroke-width="3" stroke-dasharray="5 13" stroke-dashoffset="12" stroke-linecap="round"/>
  </g>

  <!-- Twinkles -->
  <g fill="#fde68a">
    <path d="M 104 40 l 1.6 4 4 1.6 -4 1.6 -1.6 4 -1.6 -4 -4 -1.6 4 -1.6 z">
      <animate attributeName="opacity" values="1;0.2;1" dur="1.6s" repeatCount="indefinite"/>
    </path>
    <path d="M 12 78 l 1.3 3.2 3.2 1.3 -3.2 1.3 -1.3 3.2 -1.3 -3.2 -3.2 -1.3 3.2 -1.3 z">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="1.9s" repeatCount="indefinite"/>
    </path>
    <path d="M 84 6 l 1.1 2.7 2.7 1.1 -2.7 1.1 -1.1 2.7 -1.1 -2.7 -2.7 -1.1 2.7 -1.1 z">
      <animate attributeName="opacity" values="1;0.3;1" dur="1.3s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- Party hat, tipped over the top-left -->
  <g transform="translate(3 7) rotate(-28 28 20)">
    <path d="M 16 30 L 28 -2 L 40 30 Z" fill="#fbbf24" stroke="#111215" stroke-width="1.6" stroke-linejoin="round"/>
    <path d="M 19.6 21 L 36.4 21 M 23.3 11 L 32.7 11" stroke="#f43f5e" stroke-width="3"/>
    <ellipse cx="28" cy="30" rx="13" ry="3" fill="#f43f5e" stroke="#111215" stroke-width="1.4"/>
    <circle cx="28" cy="-3.5" r="4.6" fill="#34d399" stroke="#111215" stroke-width="1.4"/>
  </g>

  <!-- A "3" balloon at the bottom-right, bobbing -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -2.5;0 0" dur="2.6s" repeatCount="indefinite"/>
    <path d="M 99 117 Q 96 110 99 104" fill="none" stroke="#ece9e2" stroke-width="1.2"/>
    <ellipse cx="100" cy="92" rx="13" ry="14.5" fill="url(#balloon)" stroke="#111215" stroke-width="1.6"/>
    <path d="M 97.5 106 L 102.5 106 L 100 103 Z" fill="#c026d3" stroke="#111215" stroke-width="1"/>
    <ellipse cx="95" cy="85" rx="3" ry="4.5" fill="#fff" opacity="0.35"/>
    <text x="100" y="98.5" text-anchor="middle" font-family="Arial Black, Arial, Helvetica, sans-serif" font-weight="900" font-size="17" fill="#fff" stroke="#111215" stroke-width="0.8">3</text>
  </g>
</svg>
